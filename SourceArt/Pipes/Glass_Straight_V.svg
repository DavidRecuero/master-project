<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Glass over the tube interior: a thin white layer (15 %), a reflection near the upper-left wall and a soft shade on the lower-right wall.
       Same interior shape as Pipe_Straight_V.svg, so the pieces join up. -->
  <defs>
    <clipPath id="canvasStraightV"><rect width="256" height="256"/></clipPath>
    <clipPath id="insideStraightV"><rect x="28.44" y="-400" width="199.11" height="528.00"/><rect x="28.44" y="128.00" width="199.11" height="656"/></clipPath>
    <mask id="glintStraightV" maskUnits="userSpaceOnUse" x="-500" y="-500" width="1300" height="1300">
      <g fill="#fff" transform="translate(12,12)"><rect x="28.44" y="-400" width="199.11" height="528.00"/><rect x="28.44" y="128.00" width="199.11" height="656"/></g><g fill="#000" transform="translate(28,28)"><rect x="28.44" y="-400" width="199.11" height="528.00"/><rect x="28.44" y="128.00" width="199.11" height="656"/></g>
    </mask>
    <mask id="shadeStraightV" maskUnits="userSpaceOnUse" x="-500" y="-500" width="1300" height="1300">
      <g fill="#fff"><rect x="28.44" y="-400" width="199.11" height="528.00"/><rect x="28.44" y="128.00" width="199.11" height="656"/></g><g fill="#000" transform="translate(-22,-22)"><rect x="28.44" y="-400" width="199.11" height="528.00"/><rect x="28.44" y="128.00" width="199.11" height="656"/></g>
    </mask>
  </defs>
  <g clip-path="url(#canvasStraightV)"><g clip-path="url(#insideStraightV)">
    <g fill="#FFFFFF" opacity="0.15"><rect x="28.44" y="-400" width="199.11" height="528.00"/><rect x="28.44" y="128.00" width="199.11" height="656"/></g>
    <rect x="-500" y="-500" width="1300" height="1300" fill="#FFFFFF" fill-opacity="0.85" mask="url(#glintStraightV)"/>
    <rect x="-500" y="-500" width="1300" height="1300" fill="#22304A" fill-opacity="0.12" mask="url(#shadeStraightV)"/>
  </g></g>
</svg>